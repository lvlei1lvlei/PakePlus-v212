<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>二维码扫描</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <h1>二维码扫描</h1>
    </header>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 扫描按钮 -->
      <div class="scan-section">
        <button id="scanBtn" class="scan-btn">
          <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="7" y1="7" x2="17" y2="17"></line>
            <line x1="17" y1="7" x2="7" y2="17"></line>
          </svg>
          <span>开始扫描</span>
        </button>
      </div>

      <!-- 扫描结果 -->
      <div id="resultSection" class="result-section hidden">
        <div class="result-header">
          <h2>扫描结果</h2>
          <button id="clearBtn" class="clear-btn">清除</button>
        </div>
        <div id="resultContent" class="result-content"></div>
        <div class="result-actions">
          <button id="copyBtn" class="action-btn">复制结果</button>
          <button id="rescanBtn" class="action-btn">重新扫描</button>
          <button id="openBtn" class="action-btn hidden">打开链接</button>
        </div>
      </div>

      <!-- 历史记录 -->
      <div class="history-section">
        <div class="history-header">
          <h2>历史记录</h2>
          <button id="clearHistoryBtn" class="clear-btn">清空</button>
        </div>
        <div id="historyList" class="history-list">
          <p class="no-history">暂无扫描历史</p>
        </div>
      </div>
    </main>

    <!-- 扫描界面 -->
    <div id="scanOverlay" class="scan-overlay hidden">
      <div class="scan-header">
        <button id="closeScanBtn" class="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <button id="toggleFlashBtn" class="flash-btn">
          <svg id="flashIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="13" y1="10" x2="21" y2="2"></line>
            <line x1="11" y1="14" x2="3" y2="22"></line>
            <line x1="11" y1="14" x2="3" y2="14"></line>
            <line x1="19" y1="22" x2="13" y2="16"></line>
          </svg>
        </button>
      </div>
      <div class="scan-frame">
        <div class="scan-box">
          <div class="scan-line"></div>
        </div>
        <p class="scan-tip">将二维码对准扫描框</p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
