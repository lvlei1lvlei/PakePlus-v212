<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端扫码测试</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-qrcode"></i> 移动端扫码测试</h1>
            <p class="subtitle">基于 Tauri 2.0 + Barcode Scanner 插件</p>
        </header>

        <main>
            <div class="scanner-section">
                <button id="startScan" class="btn btn-primary">
                    <i class="fas fa-camera"></i> 启动扫码
                </button>
                <p class="hint">点击按钮调用原生摄像头扫描二维码/条形码</p>
            </div>

            <div class="result-section">
                <h2><i class="fas fa-history"></i> 扫描结果</h2>
                <textarea id="result" readonly placeholder="扫描结果将显示在这里..."></textarea>
                <div class="button-group">
                    <button id="copyBtn" class="btn btn-secondary">
                        <i class="far fa-copy"></i> 复制
                    </button>
                    <button id="clearBtn" class="btn btn-warning">
                        <i class="far fa-trash-alt"></i> 清空
                    </button>
                </div>
            </div>

            <div class="history-section">
                <h3><i class="fas fa-list"></i> 历史记录</h3>
                <ul id="historyList"></ul>
                <button id="clearHistoryBtn" class="btn btn-warning">
                    <i class="fas fa-broom"></i> 清空历史
                </button>
            </div>
        </main>

        <footer>
            <p>使用 PakePlus 云端打包 | Tauri 2.0 移动端</p>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
